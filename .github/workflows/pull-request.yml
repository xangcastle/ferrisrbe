name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: rustfmt
        run: rustfmt --edition 2021 --check $(find src tests -name '*.rs')

  build-test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Bazel
        uses: bazelbuild/setup-bazelisk@v3

      - name: Mount Bazel cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/bazel
          key: ${{ runner.os }}-bazel-${{ hashFiles('MODULE.bazel', 'ui/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-bazel-

      - name: Build
        run: bazel build //:server //:worker //:cli

      # Ubuntu 24.04 runners block unprivileged user namespaces, which the network-isolation tests create.
      - name: Allow unprivileged user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Test
        run: bazel test //...

      - name: Images
        run: bazel build //oci:server.image.multiplatform //oci:worker.image.multiplatform

      - name: Clippy
        continue-on-error: true
        run: |
          bazel build --aspects=@rules_rust//rust:defs.bzl%rust_clippy_aspect \
            --output_groups=clippy_checks //:rbe_lib //:server //:worker //:cli
