name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  images:
    name: Build and push multi-platform images
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - name: Install Bazel
        uses: bazelbuild/setup-bazelisk@v3

      - name: Mount Bazel cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/bazel
          key: ${{ runner.os }}-bazel-${{ hashFiles('MODULE.bazel', 'ui/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-bazel-

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Push server and worker (linux/amd64 + linux/arm64)
        run: |
          version="${GITHUB_REF_NAME#v}"
          for image in server worker; do
            bazel run --config=release "//oci:${image}.image.push" -- --tag "$version"
          done

  release:
    name: GitHub release
    runs-on: ubuntu-latest
    needs: images
    permissions:
      contents: write

    steps:
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, 'rc') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'alpha') }}
          body: |
            ```bash
            docker pull docker.io/xangcastle/ferris-server:${{ github.ref_name }}
            docker pull docker.io/xangcastle/ferris-worker:${{ github.ref_name }}
            ```
            Both images are `linux/amd64` and `linux/arm64`.
