name: Documentation

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'proto/**'
      - 'build.rs'
      - '.github/workflows/docs.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build API docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Bazel
        uses: bazelbuild/setup-bazelisk@v3

      - name: rustdoc
        run: bazel build //:rbe_lib_doc

      - name: Prepare site
        run: |
          mkdir -p _site
          doc="$(bazel info execution_root)/$(bazel cquery --output=files //:rbe_lib_doc)"
          cp -r "$doc"/* _site/
          echo '<meta http-equiv="refresh" content="0;url=./rbe_server/">' > _site/index.html
          touch _site/.nojekyll

      - uses: actions/upload-pages-artifact@v3

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
