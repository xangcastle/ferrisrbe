services:
  server:
    image: ${FERRIS_SERVER_IMAGE:-docker.io/xangcastle/ferris-server:latest}
    container_name: ferrisrbe-server
    ports:
      - "9094:9094"
      - "8080:8080"
    volumes:
      - ferrisrbe-server-data:/data
    environment:
      RUST_LOG: info
      RBE_CACHE_DIR: /data
      RBE_BES_DATA_DIR: /data/bes
      RBE_CACHE_MAX_SIZE_GB: "100"
      RBE_CACHE_AC_MAX_SIZE_GB: "10"
    restart: unless-stopped

  worker:
    image: ${FERRIS_WORKER_IMAGE:-docker.io/xangcastle/ferris-worker:latest}
    container_name: ferrisrbe-worker
    volumes:
      - ferrisrbe-worker-data:/workspace
    environment:
      RUST_LOG: info
      WORKER_ID: compose
      SERVER_ENDPOINT: http://server:9094
      CAS_ENDPOINT: http://server:9094
      MAX_CONCURRENT: "8"
      WORKDIR: /workspace
    restart: unless-stopped
    depends_on:
      - server

  prometheus:
    image: docker.io/prom/prometheus:latest
    container_name: ferrisrbe-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro,z
      - ferrisrbe-prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'
    restart: unless-stopped
    depends_on:
      - server

  grafana:
    image: docker.io/grafana/grafana:latest
    container_name: ferrisrbe-grafana
    ports:
      - "3000:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro,z
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro,z
      - ferrisrbe-grafana-data:/var/lib/grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    restart: unless-stopped
    depends_on:
      - prometheus

volumes:
  ferrisrbe-server-data:
  ferrisrbe-worker-data:
  ferrisrbe-prometheus-data:
  ferrisrbe-grafana-data:
